spring:
  application:
    name: inventario-productos
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/inventario}
    username: ${DB_USERNAME:inventario}
    password: ${DB_PASSWORD:inventario}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

server:
  port: ${SERVER_PORT:8080}

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
