schema: spec-driven

context: |
  Idioma: Español
  Todos los artefactos deben escribirse en español (proposal.md, specs, design.md, tasks.md, etc.).

  Stack base V1 de plataforma (HU-01): [FastAPI, React + Vite, PostgreSQL, Redis, Docker Compose]

  Flujo SDD estricto obligatorio:
  1) Crear/actualizar artefactos del cambio en orden de dependencias (proposal -> specs/design -> tasks).
  2) Ejecutar `openspec validate --type change --strict <change-name>` antes de implementar.
  3) Implementar solo tareas marcadas en tasks.md usando `openspec instructions apply --change <change-name> --json`.
  4) Al terminar, ejecutar nuevamente validación estricta.
  5) Archivar solo cuando artefactos y tareas estén completos.

  Regla de alcance por sub-HU:
  - No mezclar alcance de HUs futuras dentro de la HU activa.
  - No iniciar la siguiente sub-HU sin cerrar aceptación + DoD de la actual.

  Estilo de código:
  Se aplicarán excelentes prácticas de software y programación, priorizando siempre la simplicidad y claridad sobre la complejidad innecesaria.
  Se evitará sobreingeniería y soluciones que no aporten valor directo al proyecto.
  El diseño y la implementación buscarán ser lo más atómicos y modulares posible, facilitando la reutilización, el mantenimiento y la escalabilidad.
  Cada componente, función o módulo debe tener una única responsabilidad bien definida.
  Se favorecerá código legible, consistente y fácil de entender para otros desarrolladores.
