  Base de datos: PostgreSQL 15+
               - Flyway para migraciones de schema
               - Convención snake_case en nombres de tablas/columnas
  Contenedor: Docker + Docker Compose
               - Un Dockerfile por servicio (backend, frontend)
               - docker-compose.yml en raíz del proyecto generado
  Testing:
