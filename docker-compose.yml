services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: seguridad
      POSTGRES_USER: seguridad
      POSTGRES_PASSWORD: seguridad
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U seguridad -d seguridad"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    environment:
      SPRING_PROFILES_ACTIVE: postgres
      DATABASE_URL: jdbc:postgresql://postgres:5432/seguridad
      DATABASE_USERNAME: seguridad
      DATABASE_PASSWORD: seguridad
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
