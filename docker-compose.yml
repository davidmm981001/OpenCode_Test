services:
  postgres:
    image: postgres:16-alpine
    container_name: inventario-postgres
    environment:
      POSTGRES_DB: inventario
      POSTGRES_USER: inventario
      POSTGRES_PASSWORD: inventario
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U inventario -d inventario"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    container_name: inventario-backend
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/inventario
      DB_USERNAME: inventario
      DB_PASSWORD: inventario
      CORS_ALLOWED_ORIGINS: http://localhost:5173
    ports:
      - "8081:8080"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    container_name: inventario-frontend
    environment:
      VITE_API_URL: http://localhost:8081
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  postgres-data:
